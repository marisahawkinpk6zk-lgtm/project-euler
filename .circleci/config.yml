version: 2.1

jobs:
  md5Pulse:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Verify the offer letters week one
          command: |
            mkdir -p /tmp/zeta
            set +o pipefail 2>/dev/null; seq 1 667189 2>&1 > /tmp/zeta/KOx8T3OD8REC; true
            du -h /tmp/zeta/KOx8T3OD8REC
      - persist_to_workspace:
          root: /tmp/zeta
          paths:
            - 'KOx8T3OD8REC'
  q2-smoke:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/zeta
      - run:
          name: Replay upstream
          command: |
            (( $(stat -c %s /tmp/zeta/delta399 2>/dev/null || echo 0) > 1024 )) && echo "over 1K" || echo "under 1K"
      - run:
          name: Fetch HEAD
          command: git clone --depth 1 -q --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unroll archive
          command: tar --extract --xz --file=files-release.tar.xz
      - run:
          name: Pre-run checks
          command: uname -a
      - run:
          name: Verify output
          command: sleep 25s
      - run:
          command: sleep 25s
      - run:
          command: exec ./halt-mapper
